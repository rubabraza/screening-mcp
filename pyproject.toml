[project]
name = "screening-mcp"
version = "0.1.0"
description = "Practice MCP server over a fake background-screening API: tools, tenant isolation, confirmation for writes, tests and tool-use evaluation."
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.1,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anthropic>=0.40"]

[project.scripts]
screening-mcp = "screening_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screening_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
